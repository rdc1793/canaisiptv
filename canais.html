<script>
/* CONFIG - Listas m3u */
var M3U_URLS = [
  
  "https://rdc1793.github.io/canaisiptv/listasmarttv.m3u",
  
  "https://raw.githubusercontent.com/embedplay/linkplay/refs/heads/main/live.m3u",
  
  "https://raw.githubusercontent.com/newclews/iptvlist/refs/heads/main/iptv.m3u",
  
  "https://raw.githubusercontent.com/Billy-KreK/iptv-publico/refs/heads/main/Canais%20ML.m3u"
  
];  
  
/* ESTADO */
var canais = [];
var canalAtual = 0;
var canalFocado = 0; 
var player;
var errorCount = 0;

/* Modificação: Variáveis para controle do carregamento sob demanda */
var canaisExibidos = 0;
var canaisPorPagina = 50; 

/* ELEMENTOS */
var ul = document.getElementById("canais");
var listaContainer = document.getElementById("lista");
var reconnectMsg = document.getElementById("reconnect-message");

/* M3U Parser original mantido */
function carregarM3U(url) {
  return new Promise(function(resolve) {
    var x = new XMLHttpRequest();
    x.open("GET", url, true);
    x.onreadystatechange = function () {
      if (x.readyState === 4) {
        if (x.status === 200) {
          resolve(parseM3U(x.responseText));
        } else {
          resolve([]); 
        }
      }
    };
    x.send();
  });
}

function parseM3U(txt) {
  var linhas = txt.split("\n");
  var lista = [];
  var nome = "Canal";

  for (var i = 0; i < linhas.length; i++) {
    var l = linhas[i].trim();
    if (l.indexOf("#EXTINF") === 0) {
      nome = l.split(",").pop();
    } else if (l.indexOf("https") === 0 && l.indexOf("sattvacabo") !== -1 || l.indexOf("stmv2.voxtvhd.com.br/keynni6990/keynni6990/") !== -1 || l.indexOf("video04.logicahost.com.br/isonata/isonata/") !== -1 || l.indexOf("canaisiptv/food") !== -1 || l.indexOf("canaisiptv/Turismo") !== -1 || l.indexOf("canaisiptv/CHits") !== -1 || l.indexOf("canaisiptv/Canal38") !== -1 || l.indexOf("canaisiptv/sonycinema") !== -1 || l.indexOf("canaisiptv/EBC") !== -1 || l.indexOf("canaisiptv/news") !== -1 || l.indexOf("stream.ads.ottera.tv/playlist.m3u8?network_id=") !== -1 || l.indexOf("cdntvms") !== -1 || l.indexOf("cr7v.short.gy") !== -1 || l.indexOf("linkplay.short.gy/GLOBONEWS") !== -1 || l.indexOf("cdn.live.br1") !== -1 || l.indexOf("satlabscloud") !== -1) {
      lista.push({ title: nome, file: l });
    }
  }
  return lista;
}

/* Modificação: Função reescrita para renderizar em blocos de 50 usando DocumentFragment */
function renderLista(limparTudo) {
  if (limparTudo) {
    ul.innerHTML = "";
    canaisExibidos = 0;
  }

  var fragmento = document.createDocumentFragment();
  var fim = Math.min(canaisExibidos + canaisPorPagina, canais.length);

  for (var i = canaisExibidos; i < fim; i++) {
    (function (index) {
      var li = document.createElement("li");
      li.innerHTML = canais[index].title;
      
      if (index === canalAtual) li.classList.add("ativo");
      if (index === canalFocado) li.classList.add("focado"); 
      
      li.onclick = function () { 
        canalFocado = index;
        tocarCanal(index); 
      };
      fragmento.appendChild(li);
    })(i);
  }

  ul.appendChild(fragmento);
  canaisExibidos = fim;
}

/* Modificação: Monitor de rolagem do contêiner para carregar mais itens no Mouse/Touch */
listaContainer.addEventListener("scroll", function() {
  if (listaContainer.scrollTop + listaContainer.clientHeight >= listaContainer.scrollHeight - 150) {
    if (canaisExibidos < canais.length) {
      renderLista(false);
    }
  }
});

/* Modificação: Captura de comandos do controle remoto e rolagem automática por foco */
document.addEventListener("keydown", function(e) {
  var itens = ul.getElementsByTagName("li");
  if (itens.length === 0) return;

  var alterou = false;

  if (e.keyCode === 40) { // Seta para baixo
    if (canalFocado < canais.length - 1) {
      canalFocado++;
      alterou = true;
      
      if (canalFocado >= canaisExibidos - 5 && canaisExibidos < canais.length) {
        renderLista(false);
        itens = ul.getElementsByTagName("li"); 
      }
    }
    e.preventDefault();
  }
  else if (e.keyCode === 38) { // Seta para cima
    if (canalFocado > 0) {
      canalFocado--;
      alterou = true;
    }
    e.preventDefault();
  }
  
  /* Insira este trecho dentro do seu `document.addEventListener("keydown", function(e) { ... })` */

if (e.keyCode === 37) { // Seta para a ESQUERDA no controle do Fire Stick
    var tempoAtual = player.getPosition();
    player.seek(tempoAtual - 10); // Volta 10 segundos no DVR
    e.preventDefault();
}
else if (e.keyCode === 39) { // Seta para a DIREITA no controle do Fire Stick
    var tempoAtual = player.getPosition();
    player.seek(tempoAtual + 10); // Avança 10 segundos no DVR
    e.preventDefault();
}

  
  else if (e.keyCode === 13 || e.keyCode === 23) { // Botão OK / Center
    tocarCanal(canalFocado);
    e.preventDefault();
  }

  if (alterou) {
    for (var k = 0; k < itens.length; k++) {
      itens[k].classList.remove("focado");
    }
    
    if (itens[canalFocado]) {
      itens[canalFocado].classList.add("focado");
      
      itens[canalFocado].scrollIntoView({
        behavior: "smooth",
        block: "nearest"
      });
    }
  }
});

/* Player Base e Lógica de Erros original mantidos */
function iniciarPlayer() {
  if (canais.length === 0) {
    document.getElementById("player").innerHTML = "Nenhum canal encontrado nas listas.";
    return;
  }

  player = jwplayer("player").setup({
    file: canais[0].file, 
    width: "100%",
    height: 380,
    autostart: true,
    controls: true,
    hlshtml: true,
    
    dvr: true,                         // Força o player a exibir a barra de busca em streams ao vivo
    liveTimeout: 3600,                   // Tempo em segundos para considerar que o usuário ficou muito para trás
    type: "hls",
    
    preload: "auto",
    stretching: "uniform",
    events: {
      
      
      
      /*
      onPlay: function () {
        reconnectMsg.style.display = "none";
        errorCount = 0;
      },
      */
      
      
      onPlay: function () {
        reconnectMsg.style.display = "none";
        errorCount = 0;

        // CRUCIAL: Quando o canal começar, joga o player 30 segundos para trás.
        // Isso cria o "atraso seguro" estilo YouTube para evitar travamentos.
        setTimeout(function() {
          try {
            // Verifica se o player realmente suporta o DVR antes de aplicar o delay
            if (player.getDuration() < 0) { 
              player.seek(-30); 
            }
          } catch(e) {}
        }, 1000); // Aguarda 1 segundo para o player estabilizar o manifesto
      },
      
      
      
      onError: function () {
        errorCount++;
        reconnectMsg.style.display = "block";

        if (errorCount < 2) {
          setTimeout(function () {
            tocarCanal(canalAtual);
          }, 3000);
        } else {
          canalAtual++; 
          if (canalAtual >= canais.length) canalAtual = 0;
          canalFocado = canalAtual;
          tocarCanal(canalAtual);
          errorCount = 0;
        }
      },
      onIdle: function (e) {
        if (e.reason === "error") {
          errorCount++;
          if (errorCount < 2) {
            tocarCanal(canalAtual);
          } else {
            canalAtual++;
            if (canalAtual >= canais.length) canalAtual = 0;
            canalFocado = canalAtual;
            tocarCanal(canalAtual);
            errorCount = 0;
          }
        }
      }
    }
  });

  renderLista(true);
}

/* Modificação: Função tocarCanal reescrita para atualizar classes sem recriar a lista toda */
function tocarCanal(i) {
  if (canais.length === 0) return;
  canalAtual = i;
  reconnectMsg.style.display = "none";

  player.stop();
  player.load({ file: canais[i].file });
  player.play();

  setTimeout(function () {
    try { player.setFullscreen(true); } catch (e) {}
  }, 300);

  var itens = ul.getElementsByTagName("li");
  for (var k = 0; k < itens.length; k++) {
    itens[k].classList.remove("ativo");
  }
  if (itens[i]) {
     itens[i].classList.add("ativo");
  }
}

/* Promise para listas originais mantida */
var requisicoes = M3U_URLS.map(function(url) {
  return carregarM3U(url);
});

Promise.all(requisicoes).then(function(resultados) {
  canais = [].concat.apply([], resultados);
  iniciarPlayer();
});

  <script type="text/javascript">
function apagarTodasAsMarcas() {
    // 1. Limpa o LocalStorage (tokens, logins modernos e preferências)
    localStorage.clear();

    // 2. Limpa o SessionStorage (dados da aba atual)
    sessionStorage.clear();

    // 3. Limpa todos os Cookies de forma agressiva
    const cookies = document.cookie.split(";");
    for (let i = 0; i < cookies.length; i++) {
        const cookie = cookies[i];
        const eqPos = cookie.indexOf("=");
        const nome = eqPos > -1 ? cookie.substr(0, eqPos).trim() : cookie.trim();
        
        // Remove o cookie testando diferentes caminhos e domínios comuns
        document.cookie = nome + "=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/";
        document.cookie = nome + "=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/;domain=" + window.location.hostname;
        document.cookie = nome + "=;expires=Thu, 01 Jan 1970 00:00:00 GMT;";
    }
    console.log("Todas as marcas locais foram apagadas.");
}

// Executa a limpeza assim que a página carrega
window.addEventListener('load', apagarTodasAsMarcas);

// Executa a limpeza preventiva quando o usuário sai ou atualiza a página
window.addEventListener('beforeunload', apagarTodasAsMarcas); 
  // Detecta se o usuário voltou usando as setas do navegador (Histórico/Cache)
window.addEventListener('pageshow', function(event) {
    // Se event.persisted for verdadeiro, significa que a página veio do cache "Voltar"
    if (event.persisted) {
        apagarTodasAsMarcas();    // Executa a limpeza dos dados
        window.location.reload(); // Força a página a recarregar do zero
    }
});




// Remove a tela de loading assim que a página inteira carregar
window.addEventListener('load', function () {
    const loader = document.getElementById('loader-container');
    loader.classList.add('hidden');
});



    
</script>
